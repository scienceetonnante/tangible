id: optimizers
title: Why adaptive optimizers exist
promise: See how SGD, momentum, and AdamW navigate the same loss landscape.
scene: ./scenes/scene.ts
defaults:
  anticipation: -0.2
  ease: inOutCubic
  transition: 1.0
deployment:
  provider: huggingface
  space: dlouapre/tangible-optimizers
tts:
  provider: hf-endpoint
  voice: david_v1
assistant:
  provider: huggingface
  model: google/gemma-4-31B-it:cerebras
  context: assistant.md
  limits:
    request:
      bodyBytes: 65536
      questionCharacters: 1000
      historyTurns: 8
      positionCharacters: 2000
    response:
      outputTokens: 1200
      beats: 6
      beatCharacters: 600
      answerCharacters: 2000
      transitionSeconds: 2
    rate:
      browserRequestsPerTenMinutes: 12
      ipRequestsPerTenMinutes: 100
      globalRequestsPerHour: 1000
      globalRequestsPerDay: 5000
      concurrentProviderCalls: 8
    queue:
      maxPendingRequests: 30
      waitTimeoutSeconds: 30
    providerTimeoutSeconds: 45
  commandable:
    - kappa
    - start.x
    - start.y
    - step
    - active.sgd
    - active.momentum
    - active.adamw
    - sgd.lr
    - momentum.lr
    - momentum.beta
    - adamw.lr
