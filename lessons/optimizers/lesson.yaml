id: optimizers
title: Why adaptive optimizers exist
scene: ./scenes/scene.ts
defaults:
  anticipation: -0.2
  ease: inOutCubic
  transition: 1.0
player:
  autoplay: true
tts:
  provider: hf-endpoint
  voice: david_v1
assistant:
  provider: huggingface
  model: google/gemma-4-31B-it:cerebras
  context: assistant.md
  commandable:
    - kappa
    - roughness
    - start.x
    - start.y
    - step
    - active.sgd
    - active.momentum
    - active.adamw
    - sgd.lr
    - momentum.lr
    - momentum.beta
    - adamw.lr
